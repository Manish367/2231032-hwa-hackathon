<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PawQuest — Order dashboard</title><link rel="stylesheet" href="/styles.css"><style>
.admin-wrap{max-width:1100px;margin:55px auto;padding:0 25px}.admin-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:35px}.admin-top h1{font:800 38px var(--display);letter-spacing:-.06em;margin:5px 0}.admin-card{background:var(--paper);padding:22px;border:1px solid var(--line);overflow:auto}.admin-table{width:100%;border-collapse:collapse;font-size:11px}.admin-table th,.admin-table td{text-align:left;padding:14px 10px;border-bottom:1px solid var(--line);vertical-align:top}.admin-table th{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:#7b8176}.admin-empty{color:#7c8278;font-size:12px;padding:30px 0}.admin-back{font-size:11px;border-bottom:1px solid #aaa;padding-bottom:4px}
</style></head><body><div class="announcement">PAWQUEST · STORE ADMIN</div><header class="site-header"><a class="brand" href="/"><span class="brand-mark">✳</span><span>pawquest<span class="brand-dot">.</span></span></a><a class="admin-back" href="/">← Back to storefront</a></header><main class="admin-wrap"><div class="admin-top"><div><p class="eyebrow">STORE MANAGEMENT</p><h1>Order dashboard</h1><p style="font-size:12px;color:#7b8176">Demo orders placed through the PawQuest checkout.</p></div><button class="add-button" id="refresh">Refresh orders ↻</button></div><div class="admin-card"><div id="orders"><p class="admin-empty">Loading orders…</p></div></div></main><script>
async function load(){const root=document.getElementById('orders');try{const r=await fetch('/api/admin/orders');if(!r.ok)throw new Error('Could not load orders');const orders=await r.json();if(!orders.length){root.innerHTML='<p class="admin-empty">No orders yet. Place a demo order in the storefront to see it here.</p>';return;}root.innerHTML='<table class="admin-table"><thead><tr><th>Order</th><th>Date</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th></tr></thead><tbody>'+orders.map(o=>'<tr><td><strong>'+o.id+'</strong></td><td>'+new Date(o.createdAt).toLocaleString()+'</td><td>'+o.customer.name+'<br>'+o.customer.email+'<br>'+o.customer.city+'</td><td>'+o.items.map(i=>i.name+' × '+i.quantity).join('<br>')+'</td><td>₹'+o.total.toLocaleString('en-IN')+'</td><td>'+o.status+'</td></tr>').join('')+'</tbody></table>';}catch(e){root.innerHTML='<p class="admin-empty">Unable to load orders. Start the server and refresh.</p>';}}
document.getElementById('refresh').addEventListener('click',load);load();
</script></body></html>
